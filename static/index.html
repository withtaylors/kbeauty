<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFB">
<title>K-Beauty Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body>
<header>
  <div class="brand">K-Beauty Scan<small>SEOUL SHOPPING BUDDY</small></div>
  <nav class="tabs" role="tablist">
    <button data-v="scan" data-i="tabScan">Scan</button>
    <button data-v="list"><span data-i="tabList">List</span><span class="badge hidden" id="badge"></span></button>
    <button data-v="trip" data-i="tabTrip">Trip</button>
    <button data-v="setup" aria-label="Settings">⚙︎</button>
  </nav>
</header>

<section id="v-setup" class="view" role="tabpanel">
  <h2 data-i="setupTitle"></h2>
  <p class="sub" data-i="setupSub"></p>
  <div class="card"><span class="lbl" data-i="language"></span>
    <div class="chips" id="c-lang" role="radiogroup"><span class="chip" data-v="en">English</span><span class="chip" data-v="ko">한국어</span></div></div>
  <div class="card"><span class="lbl" data-i="homeCurrency"></span>
    <div class="chips" id="c-cur" role="radiogroup"><span class="chip" data-v="USD">USD $</span><span class="chip" data-v="JPY">JPY ¥</span></div></div>
  <div class="card"><span class="lbl" data-i="skinType"></span>
    <div class="chips" id="c-skin" role="radiogroup"><span class="chip" data-v="dry"></span><span class="chip" data-v="oily"></span><span class="chip" data-v="combination"></span><span class="chip" data-v="sensitive"></span></div></div>
  <div class="float"><button class="primary silver" id="btn-save-profile" data-i="start"></button></div>
</section>

<section id="v-scan" class="view" role="tabpanel">
  <h2 data-i="scanTitle"></h2>
  <p class="sub" data-i="scanSub"></p>
  <div class="capture">
    <button class="cam silver" id="btn-camera">
      <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></div>
      <b data-i="takePhoto"></b><span data-i="takePhotoSub"></span>
    </button>
    <button class="cam alt silver" id="btn-gallery">
      <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l4.5-4.5L13 16l2.5-2.5L20 18"/><circle cx="15.5" cy="9.5" r="1.5"/></svg></div>
      <b data-i="fromGallery"></b><span data-i="fromGallerySub"></span>
    </button>
  </div>
  <input type="file" id="file-camera" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="file-gallery" accept="image/*" class="hidden">
  <div class="or" data-i="or"></div>
  <form class="searchbar" id="search-form"><input id="q" placeholder="e.g. Anua toner, 조선미녀" autocomplete="off">
    <button type="submit" class="primary silver" data-i="find"></button></form>
  <div class="loading" id="loading"><div class="spin"></div><span data-i="reading"></span></div>
  <div id="result" aria-live="polite"></div>
</section>

<section id="v-list" class="view" role="tabpanel">
  <h2 data-i="listTitle"></h2>
  <p class="sub" data-i="listSub"></p>
  <div id="list"></div>
  <div class="reqs" id="requests"></div>
  <div class="float hidden" id="list-cta"><button class="primary silver" data-go="trip" data-i="seeTrip"></button></div>
</section>

<section id="v-trip" class="view" role="tabpanel">
  <h2 data-i="tripTitle"></h2>
  <div id="trip"></div>
  <div class="float hidden" id="trip-cta"><button class="primary silver" id="btn-save-image" data-i="saveImage"></button><button class="ghost silver" data-go="scan" data-i="keepShopping"></button></div>
</section>

<div class="offscreen" aria-hidden="true"><div class="receipt" id="receipt"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="/static/app.js" type="module"></script>
</body>
</html>
