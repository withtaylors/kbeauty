[project]
name = "kbeauty-scan"
version = "0.2.0"
description = "Scan a K-beauty product in a Korean store and see, in your language, what it is, whether it suits your skin, and what you save vs. home."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.4", "mypy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["kbeauty"]
ignore_missing_imports = true
warn_unused_ignores = true
